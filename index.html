<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Window Workspace</title>

  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/icon.png" />
  <meta name="theme-color" content="#0b0f14" />

  <style>
    :root{
      --bg:#0b0f14;
      --panel:#11161d;
      --line:#243042;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#7c3aed;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .workspace {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10000;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.16);
      background: rgba(17,22,29,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      width: min(720px, calc(100vw - 28px));
    }

    .topbar input {
      flex: 1;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(7,10,15,.92);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
      font: inherit;
      font-size: 13px;
    }
    .topbar input::placeholder { color: #64748b; }
    .topbar input:focus {
      border-color: rgba(124,58,237,.8);
      box-shadow: 0 0 0 3px rgba(124,58,237,.18);
    }

    .topbar button {
      width: auto;
      padding: 8px 10px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, rgba(124,58,237,.96), rgba(99,102,241,.92));
      white-space: nowrap;
    }

    .topbar .secondary {
      background: rgba(148,163,184,.12);
      border: 1px solid rgba(148,163,184,.18);
      font-weight: 600;
    }

    .icon-btn {
      width: 34px !important;
      height: 34px;
      padding: 0 !important;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 16px !important;
      line-height: 1;
    }

    .settings-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .settings-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 270px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(148,163,184,.16);
      background: rgba(17,22,29,.96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      display: none;
      z-index: 10001;
    }
    .settings-panel.open { display: grid; gap: 10px; }

    .settings-panel .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .settings-panel .row {
      display: grid;
      gap: 8px;
    }

    .settings-panel input[type="color"] {
      width: 100%;
      height: 38px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(7,10,15,.92);
      border-radius: 10px;
      padding: 4px;
    }

    .settings-panel input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .settings-panel .mini-actions {
      display: flex;
      gap: 8px;
    }

    .settings-panel .mini-actions button {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 10px;
    }

    .panel {
      position: absolute;
      min-width: 260px;
      min-height: 180px;
      width: 520px;
      height: 420px;
      background: rgba(17,22,29,.88);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      resize: both;
      backdrop-filter: blur(12px);
    }

    .panel.focused {
      border-color: rgba(124,58,237,.72);
      box-shadow: 0 20px 60px rgba(0,0,0,.52);
    }

    .panel-header {
      height: 44px;
      background: linear-gradient(180deg, rgba(21,27,35,.98), rgba(14,18,24,.98));
      border-bottom: 1px solid rgba(148,163,184,.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      cursor: grab;
      user-select: none;
    }
    .panel-header:active { cursor: grabbing; }

    .panel-header .meta {
      min-width: 0;
      display: grid;
      gap: 1px;
    }
    .panel-header .meta .name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-header .meta .small {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .window-controls button {
      width: 32px;
      height: 28px;
      padding: 0;
      border-radius: 9px;
      background: rgba(148,163,184,.10);
      border: 1px solid rgba(148,163,184,.15);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }

    .panel-body {
      height: calc(100% - 44px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .site-bar {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid rgba(148,163,184,.12);
      background: rgba(2,6,23,.28);
    }
    .site-bar input {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(7,10,15,.92);
      color: var(--text);
      min-width: 0;
    }
    .site-bar button {
      width: auto;
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      border: 0;
      color: white;
      background: linear-gradient(135deg, rgba(124,58,237,.96), rgba(99,102,241,.92));
      cursor: pointer;
    }

    iframe.webview {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b0f14;
      flex: 1;
      min-height: 0;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }
    .empty-state .box {
      max-width: 520px;
      border: 1px dashed rgba(148,163,184,.22);
      border-radius: 22px;
      padding: 28px;
      background: rgba(255,255,255,.02);
    }
    .empty-state h3 {
      margin: 0 0 10px;
      color: #e5e7eb;
      font-size: 18px;
    }

    .player {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 420px;
      height: 236px;
      min-width: 260px;
      min-height: 160px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(8,12,18,.94);
      border: 1px solid rgba(148,163,184,.18);
      box-shadow: var(--shadow);
      z-index: 9999;
      resize: both;
      backdrop-filter: blur(12px);
    }
    .player.hidden { display: none; }

    .player-header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      background: linear-gradient(180deg, rgba(21,27,35,.98), rgba(14,18,24,.98));
      border-bottom: 1px solid rgba(148,163,184,.14);
      cursor: grab;
      user-select: none;
    }
    .player-header:active { cursor: grabbing; }
    .player-header .meta {
      display: grid;
      gap: 1px;
    }
    .player-header .meta strong { font-size: 12px; }
    .player-header .meta span {
      color: var(--muted);
      font-size: 11px;
    }
    .player-content {
      height: calc(100% - 40px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .player-controls {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid rgba(148,163,184,.12);
      background: rgba(2,6,23,.25);
    }
    .player-controls input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(7,10,15,.92);
      color: var(--text);
    }
    .player-controls button {
      width: auto;
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      border: 0;
      color: white;
      background: linear-gradient(135deg, rgba(124,58,237,.96), rgba(99,102,241,.92));
      cursor: pointer;
    }
    .player-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      background: #000;
    }

    @media (max-width: 700px) {
      .topbar { width: calc(100vw - 28px); }
      .panel { width: calc(100vw - 28px); height: 55vh; }
      .player { width: calc(100vw - 28px); }
    }
  </style>
</head>
<body>
  <div class="workspace" id="workspace">
    <div class="topbar">
      <input id="siteTitle" placeholder="Title" />
      <input id="siteUrl" placeholder="Website URL" />
      <button id="addSiteBtn">Open</button>
      <button id="loadVideoBtn" class="secondary">Play</button>

      <div class="settings-wrap">
        <button id="settingsBtn" class="icon-btn secondary" title="Settings">⚙</button>
        <div class="settings-panel" id="settingsPanel">
          <div class="row">
            <div>
              <div class="label">Background color</div>
              <input id="bgColor" type="color" value="#0b0f14" />
            </div>
            <div>
              <div class="label">Background image</div>
              <input id="bgImage" type="file" accept="image/*" />
            </div>
            <div class="mini-actions">
              <button id="clearBgBtn" class="secondary">Clear</button>
              <button id="closeSettingsBtn">Done</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="box">
        <h3>No panels open yet</h3>
        <div>Use the top-right controls to open a website panel or load a video into the floating player.</div>
      </div>
    </div>

    <div class="player hidden" id="player">
      <div class="player-header" id="playerHeader">
        <div class="meta">
          <strong>Mini player</strong>
          <span id="playerStatus">Drop in a YouTube link</span>
        </div>
        <div class="window-controls">
          <button id="hidePlayerBtn" title="Hide">×</button>
        </div>
      </div>
      <div class="player-content">
        <div class="player-controls">
          <input id="playerUrl" placeholder="YouTube or video link" />
          <button id="playerLoadBtn">Load</button>
        </div>
        <iframe class="player-frame" id="playerFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

<script>
(() => {
  const workspace = document.getElementById('workspace');
  const emptyState = document.getElementById('emptyState');

  const siteTitle = document.getElementById('siteTitle');
  const siteUrl = document.getElementById('siteUrl');
  const addSiteBtn = document.getElementById('addSiteBtn');
  const loadVideoBtn = document.getElementById('loadVideoBtn');

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const bgColor = document.getElementById('bgColor');
  const bgImage = document.getElementById('bgImage');
  const clearBgBtn = document.getElementById('clearBgBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');

  const player = document.getElementById('player');
  const playerHeader = document.getElementById('playerHeader');
  const playerFrame = document.getElementById('playerFrame');
  const playerUrl = document.getElementById('playerUrl');
  const playerLoadBtn = document.getElementById('playerLoadBtn');
  const playerStatus = document.getElementById('playerStatus');
  const hidePlayerBtn = document.getElementById('hidePlayerBtn');

  const STORAGE_KEY = 'dark_multi_site_workspace_v5';

  let state = loadState();
  let zIndex = 10;
  let nextId = state.nextId || 1;

  function defaultState() {
    return {
      panels: [],
      player: { hidden: false, url: '', x: null, y: null, w: 420, h: 236 },
      bg: { color: '#0b0f14', image: '' },
      drafts: { title: '', url: '', playerUrl: '' },
      nextId: 1
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return {
        ...defaultState(),
        ...parsed,
        bg: { ...defaultState().bg, ...(parsed.bg || {}) },
        player: { ...defaultState().player, ...(parsed.player || {}) },
        drafts: { ...defaultState().drafts, ...(parsed.drafts || {}) }
      };
    } catch {
      return defaultState();
    }
  }

  function saveState() {
    state.nextId = nextId;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (state.bg?.color) {
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', state.bg.color);
    }
  }

  function normalizeUrl(input) {
    let url = (input || '').trim();
    if (!url) return '';
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url;
  }

  function toTitle(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '') || url;
    } catch {
      return url;
    }
  }

  function isYouTube(url) {
    return /(?:youtube\.com|youtu\.be)/i.test(url);
  }

  function toEmbedUrl(url) {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\./, '').toLowerCase();

      if (host === 'youtu.be') {
        const id = u.pathname.split('/').filter(Boolean)[0];
        if (id) return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
      }

      if (host.endsWith('youtube.com')) {
        const id = u.searchParams.get('v');
        if (id) return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
        const path = u.pathname.replace('/shorts/', '/embed/').replace('/live/', '/embed/');
        if (path.includes('/embed/')) return `https://www.youtube-nocookie.com${path}?autoplay=1&rel=0&modestbranding=1`;
      }

      return url;
    } catch {
      return url;
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function updateEmptyState() {
    emptyState.style.display = workspace.querySelector('.panel') ? 'none' : 'grid';
  }

  function applyBackground() {
    const color = state.bg?.color || '#0b0f14';
    const image = state.bg?.image || '';

    document.body.style.backgroundColor = color;
    document.body.style.backgroundImage = image ? `url("${image}")` : 'none';
    document.body.style.backgroundRepeat = image ? 'no-repeat' : '';
    document.body.style.backgroundPosition = image ? 'center center' : '';
    document.body.style.backgroundSize = image ? 'cover' : '';
    bgColor.value = color;

    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', color);
  }

  function syncPanelRecordFromElement(id, panel, input) {
    const record = state.panels.find(p => p.id === id);
    if (!record) return;
    record.title = panel.querySelector('.name').textContent;
    record.url = input.value;
    record.x = Math.round(parseFloat(panel.style.left) || panel.offsetLeft || 0);
    record.y = Math.round(parseFloat(panel.style.top) || panel.offsetTop || 0);
    record.w = Math.round(parseFloat(panel.style.width) || panel.offsetWidth || 0);
    record.h = Math.round(parseFloat(panel.style.height) || panel.offsetHeight || 0);
  }

  function addPanel({ title, url, x, y, w, h }) {
    const id = nextId++;
    const panel = document.createElement('section');
    panel.className = 'panel';
    panel.dataset.id = id;
    panel.style.left = `${x ?? 40 + (state.panels.length * 24) % 180}px`;
    panel.style.top = `${y ?? 110 + (state.panels.length * 24) % 160}px`;
    panel.style.width = `${w ?? 520}px`;
    panel.style.height = `${h ?? 420}px`;
    panel.style.zIndex = ++zIndex;

    const safeUrl = normalizeUrl(url);
    const displayTitle = title || toTitle(safeUrl);

    panel.innerHTML = `
      <div class="panel-header">
        <div class="meta">
          <div class="name">${escapeHtml(displayTitle)}</div>
          <div class="small">${escapeHtml(safeUrl)}</div>
        </div>
        <div class="window-controls">
          <button class="reload" title="Reload">↻</button>
          <button class="open" title="Open externally">↗</button>
          <button class="close" title="Close">×</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="site-bar">
          <input class="site-input" value="${escapeHtml(safeUrl)}" />
          <button class="go">Go</button>
        </div>
        <iframe class="webview" referrerpolicy="no-referrer-when-downgrade" loading="lazy"></iframe>
      </div>
    `;

    const iframe = panel.querySelector('.webview');
    const input = panel.querySelector('.site-input');
    const header = panel.querySelector('.panel-header');
    const reloadBtn = panel.querySelector('.reload');
    const openBtn = panel.querySelector('.open');
    const closeBtn = panel.querySelector('.close');
    const goBtn = panel.querySelector('.go');

    function syncSaved() {
      syncPanelRecordFromElement(id, panel, input);
      saveState();
    }

    function setUrl(newUrl) {
      const normalized = normalizeUrl(newUrl);
      if (!normalized) return;
      input.value = normalized;
      panel.querySelector('.name').textContent = toTitle(normalized);
      panel.querySelector('.small').textContent = normalized;
      iframe.src = normalized;
      syncSaved();
    }

    iframe.src = safeUrl;

    reloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      iframe.src = iframe.src;
    });

    openBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.open(input.value, '_blank', 'noopener,noreferrer');
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.remove();
      state.panels = state.panels.filter(p => p.id !== id);
      updateEmptyState();
      saveState();
    });

    goBtn.addEventListener('click', () => setUrl(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setUrl(input.value);
    });

    panel.addEventListener('pointerdown', () => {
      panel.style.zIndex = ++zIndex;
      player.style.zIndex = 9999;
      panel.classList.add('focused');
      setTimeout(() => panel.classList.remove('focused'), 180);
    });

    makeDraggable(panel, header, syncSaved);
    makeSavingResizeObserver(panel, syncSaved);

    workspace.appendChild(panel);
    state.panels.push({
      id,
      title: displayTitle,
      url: safeUrl,
      x: parseInt(panel.style.left, 10),
      y: parseInt(panel.style.top, 10),
      w: parseInt(panel.style.width, 10),
      h: parseInt(panel.style.height, 10)
    });
    updateEmptyState();
    saveState();
  }

  function makeDraggable(el, handle, onMoveEnd) {
    let startX = 0, startY = 0, startLeft = 0, startTop = 0, dragging = false;

    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      dragging = true;
      el.style.zIndex = ++zIndex;
      startX = e.clientX;
      startY = e.clientY;
      startLeft = parseFloat(el.style.left) || el.offsetLeft;
      startTop = parseFloat(el.style.top) || el.offsetTop;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      el.style.left = `${Math.max(0, startLeft + dx)}px`;
      el.style.top = `${Math.max(0, startTop + dy)}px`;
      onMoveEnd && onMoveEnd();
    });

    handle.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;

      const snap = 22;
      const rect = el.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let left = rect.left;
      let top = rect.top;

      if (Math.abs(rect.left) <= snap) left = 0;
      if (Math.abs(rect.top) <= snap) top = 0;
      if (Math.abs(vw - rect.right) <= snap) left = Math.max(0, vw - rect.width);
      if (Math.abs(vh - rect.bottom) <= snap) top = Math.max(0, vh - rect.height);

      el.style.left = `${left}px`;
      el.style.top = `${top}px`;

      onMoveEnd && onMoveEnd();
      try { handle.releasePointerCapture(e.pointerId); } catch {}
    });

    handle.addEventListener('pointercancel', () => {
      dragging = false;
      onMoveEnd && onMoveEnd();
    });
  }

  function makeSavingResizeObserver(el, onResize) {
    const observer = new ResizeObserver(() => {
      onResize && onResize();
    });
    observer.observe(el);

    window.addEventListener('beforeunload', () => {
      onResize && onResize();
      saveState();
    });
  }

  function loadPlayer(url) {
    const normalized = normalizeUrl(url);
    if (!normalized) return;

    const embed = toEmbedUrl(normalized);
    playerFrame.src = embed;
    playerStatus.textContent = isYouTube(normalized) ? 'Playing YouTube embed' : 'Playing embedded video';
    playerUrl.value = normalized;

    player.classList.remove('hidden');
    state.player.hidden = false;
    state.player.url = normalized;
    saveState();
  }

  function initPlayerDragging() {
    const header = playerHeader;
    let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

    const pos = state.player || {};
    if (typeof pos.x === 'number' && typeof pos.y === 'number') {
      player.style.left = pos.x + 'px';
      player.style.top = pos.y + 'px';
      player.style.right = 'auto';
      player.style.bottom = 'auto';
    }
    if (pos.w) player.style.width = pos.w + 'px';
    if (pos.h) player.style.height = pos.h + 'px';

    header.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      dragging = true;
      player.style.zIndex = 10000;
      const rect = player.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
      header.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    header.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const left = Math.max(0, startLeft + dx);
      const top = Math.max(0, startTop + dy);
      player.style.left = `${left}px`;
      player.style.top = `${top}px`;
      player.style.right = 'auto';
      player.style.bottom = 'auto';
      state.player.x = left;
      state.player.y = top;
      saveState();
    });

    header.addEventListener('pointerup', (e) => {
      dragging = false;
      try { header.releasePointerCapture(e.pointerId); } catch {}
      saveState();
    });

    const playerResizeObs = new ResizeObserver(() => {
      const rect = player.getBoundingClientRect();
      state.player.w = Math.round(rect.width);
      state.player.h = Math.round(rect.height);
      saveState();
    });
    playerResizeObs.observe(player);
  }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
  });

  closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));

  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
      settingsPanel.classList.remove('open');
    }
  });

  bgColor.addEventListener('input', () => {
    state.bg = state.bg || {};
    state.bg.color = bgColor.value;
    applyBackground();
    saveState();
  });

  bgImage.addEventListener('change', () => {
    const file = bgImage.files && bgImage.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      state.bg = state.bg || {};
      state.bg.image = String(reader.result || '');
      applyBackground();
      saveState();
    };
    reader.readAsDataURL(file);
  });

  clearBgBtn.addEventListener('click', () => {
    state.bg = { color: bgColor.value || '#0b0f14', image: '' };
    bgImage.value = '';
    applyBackground();
    saveState();
  });

  addSiteBtn.addEventListener('click', () => {
    const url = normalizeUrl(siteUrl.value);
    if (!url) return;
    addPanel({ title: siteTitle.value.trim() || toTitle(url), url });

    siteTitle.value = '';
    siteUrl.value = '';
    state.drafts.title = '';
    state.drafts.url = '';
    saveState();
  });

  siteUrl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addSiteBtn.click();
  });
  siteTitle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') siteUrl.focus();
  });

  siteTitle.addEventListener('input', () => {
    state.drafts.title = siteTitle.value;
    saveState();
  });
  siteUrl.addEventListener('input', () => {
    state.drafts.url = siteUrl.value;
    saveState();
  });
  playerUrl.addEventListener('input', () => {
    state.drafts.playerUrl = playerUrl.value;
    saveState();
  });

  loadVideoBtn.addEventListener('click', () => loadPlayer(siteUrl.value || playerUrl.value));
  playerLoadBtn.addEventListener('click', () => loadPlayer(playerUrl.value));

  playerUrl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadPlayer(playerUrl.value);
  });

  hidePlayerBtn.addEventListener('click', () => {
    player.classList.add('hidden');
    state.player.hidden = true;
    saveState();
  });

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);

  document.title = 'Multi-Window Workspace';
  applyBackground();

  siteTitle.value = state.drafts?.title || '';
  siteUrl.value = state.drafts?.url || '';
  playerUrl.value = state.drafts?.playerUrl || '';

  if (state.player && state.player.url) {
    playerUrl.value = state.player.url;
    playerFrame.src = toEmbedUrl(state.player.url);
    playerStatus.textContent = 'Restored from saved session';
    if (!state.player.hidden) player.classList.remove('hidden');
  } else {
    player.classList.add('hidden');
  }

  if (state.panels && state.panels.length) {
    const saved = [...state.panels];
    state.panels = [];
    saved.forEach(p => addPanel(p));
  }

  if (state.bg?.color) bgColor.value = state.bg.color;
  initPlayerDragging();
  updateEmptyState();
})();
</script>
</body>
</html>
